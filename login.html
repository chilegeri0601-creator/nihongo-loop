<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 | Nihongo Loop</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-body" data-page-title="login.title">
    <main class="login-page">
      <section class="login-visual" aria-label="学习插画">
        <a class="brand login-brand" href="index.html" aria-label="返回首页">
          <span>Nihongo Loop</span>
          <small data-i18n="login.brandSub">日本語ループ</small>
        </a>
        <div class="desk-dog-card">
          <svg class="desk-dog" viewBox="0 0 640 520" role="img" aria-label="戴着必胜头带的狗狗坐在课桌前学习日语">
            <defs>
              <linearGradient id="deskDogFur" x1="0" x2="1" y1="0" y2="1">
                <stop offset="0" stop-color="#FFE6BF" />
                <stop offset="1" stop-color="#EAA04F" />
              </linearGradient>
              <linearGradient id="deskTop" x1="0" x2="1" y1="0" y2="1">
                <stop offset="0" stop-color="#FDE68A" />
                <stop offset="1" stop-color="#F59E0B" />
              </linearGradient>
              <filter id="deskShadow" x="-20%" y="-20%" width="140%" height="150%">
                <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#7f1d1d" flood-opacity="0.16" />
              </filter>
            </defs>
            <rect x="42" y="54" width="556" height="394" rx="42" fill="#FFF7ED" />
            <circle cx="136" cy="114" r="26" fill="#FEE2E2" />
            <circle cx="516" cy="126" r="34" fill="#DBEAFE" />
            <path d="M118 402h404v72H118z" fill="#8B5E34" />
            <path d="M94 354h452c24 0 38 14 33 32l-14 48H75l-13-48c-5-18 9-32 33-32Z" fill="url(#deskTop)" filter="url(#deskShadow)" />
            <path d="M119 392h442" stroke="#92400E" stroke-width="8" stroke-linecap="round" opacity="0.45" />
            <g filter="url(#deskShadow)">
              <path d="M215 182c-34-56-86-43-92 1-4 33 27 55 77 50 5-14 10-25 15-51Z" fill="#8B5E34" />
              <path d="M425 182c34-56 86-43 92 1 4 33-27 55-77 50-5-14-10-25-15-51Z" fill="#8B5E34" />
              <path d="M190 208c0-78 54-128 130-128s130 50 130 128c0 84-56 132-130 132s-130-48-130-132Z" fill="url(#deskDogFur)" />
              <path d="M216 184c26-25 60-38 104-38s78 13 104 38v34H216v-34Z" fill="#EF4444" />
              <path d="M235 202h170" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" />
              <text x="320" y="197" text-anchor="middle" font-size="44" font-weight="900" fill="#FFFFFF" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">必勝</text>
              <path d="M420 172l68-24-27 67" fill="#EF4444" />
              <path d="M430 194l60 24-50 28" fill="#EF4444" />
              <circle cx="270" cy="245" r="13" fill="#111827" />
              <circle cx="370" cy="245" r="13" fill="#111827" />
              <circle cx="266" cy="240" r="4" fill="#FFFFFF" />
              <circle cx="366" cy="240" r="4" fill="#FFFFFF" />
              <path d="M296 282c17 13 31 13 48 0" fill="none" stroke="#7C2D12" stroke-width="7" stroke-linecap="round" />
              <path d="M320 264c-13 0-21 6-21 13 0 10 42 10 42 0 0-7-8-13-21-13Z" fill="#5B2E18" />
              <circle cx="230" cy="268" r="17" fill="#FDBA74" opacity="0.7" />
              <circle cx="410" cy="268" r="17" fill="#FDBA74" opacity="0.7" />
              <path d="M220 342c30-24 68-24 94 0" fill="none" stroke="#8B5E34" stroke-width="23" stroke-linecap="round" />
              <path d="M347 342c28-24 67-23 92 0" fill="none" stroke="#8B5E34" stroke-width="23" stroke-linecap="round" />
            </g>
            <g class="desk-notes">
              <path d="M164 316c64-24 118-15 176 24v72c-58-35-112-43-176-24v-72Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4" />
              <path d="M456 316c-64-24-118-15-176 24v72c58-35 112-43 176-24v-72Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4" />
              <path d="M280 340v72" stroke="#CBD5E1" stroke-width="4" />
              <path d="M190 342h78M190 362h86M190 382h72M306 342h88M306 362h74M306 382h64" stroke="#94A3B8" stroke-width="6" stroke-linecap="round" />
              <text x="226" y="407" text-anchor="middle" font-size="22" font-weight="900" fill="#EF4444" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">日本語</text>
              <text x="370" y="407" text-anchor="middle" font-size="22" font-weight="900" fill="#2563EB" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">N5-N1</text>
            </g>
            <path d="M472 316l64-28 13 28-65 28-33 5Z" fill="#2563EB" />
            <path d="M451 349l33-5-23 24Z" fill="#FBBF24" />
          </svg>
        </div>
        <div class="login-copy">
          <h1 data-i18n="login.visualTitle">先登录，再把今天的学习节奏接上。</h1>
          <p data-i18n="login.visualLead">账号会保存你的打卡、等级、单词掌握和语法学习记录。</p>
        </div>
      </section>

      <section class="login-form-wrap" aria-label="登录注册">
        <form class="auth-panel login-panel" id="authForm">
          <div class="panel-title">
            <h2 id="authTitle" data-i18n="login.welcome">欢迎回来</h2>
            <p id="authSubtitle" data-i18n="login.welcomeSub">登录后继续今天的日语学习任务</p>
          </div>
          <div class="auth-tabs" role="tablist" aria-label="登录注册切换">
            <button class="active" type="button" data-auth-tab="login" data-i18n="common.login">登录</button>
            <button type="button" data-auth-tab="register" data-i18n="common.register">注册</button>
          </div>
          <label class="register-only">
            <span data-i18n="login.nickname">昵称</span>
            <input name="displayName" type="text" placeholder="比如：N2冲刺中" autocomplete="nickname" />
          </label>
          <label>
            <span data-i18n="login.email">邮箱</span>
            <input name="email" type="email" placeholder="you@example.com" autocomplete="email" />
          </label>
          <label class="reset-only">
            <span data-i18n="login.resetCode">找回验证码</span>
            <input name="resetCode" type="text" inputmode="numeric" placeholder="输入 6 位验证码" autocomplete="one-time-code" />
          </label>
          <label class="password-field">
            <span data-i18n="login.password">密码</span>
            <input name="password" type="password" placeholder="至少 6 位" autocomplete="current-password" />
          </label>
          <label class="confirm-password-field">
            <span data-i18n="login.confirmPassword">确认密码</span>
            <input name="confirmPassword" type="password" placeholder="再次输入密码" autocomplete="new-password" />
          </label>
          <button class="btn btn-dark form-submit" type="submit" id="authSubmit" data-i18n="login.submitLogin">登录并继续学习</button>
          <button class="forgot-link login-only" type="button" id="forgotPasswordButton" data-i18n="login.forgotButton">忘记密码？</button>
          <p class="form-note" id="authNote" data-i18n="login.noteDemo">可以使用 demo@nihongo.loop / demo123456 体验。</p>
          <div class="account-tools">
            <span id="accountLabel">当前账号：演示用户</span>
            <a href="index.html" data-i18n="login.backIndex">返回首页</a>
          </div>
        </form>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="i18n.js"></script>
    <script src="login.js"></script>
  </body>
</html>
